name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORMS_DB_POSTGRES_DSN: postgres://formsdb:formsdb-test-password@127.0.0.1:5432/formsdb_test?sslmode=disable
      FORMS_DB_MYSQL_DSN: formsdb:formsdb-test-password@tcp(127.0.0.1:3306)/formsdb_test?parseTime=true&tls=skip-verify
      FORMS_DB_MARIADB_DSN: formsdb:formsdb-test-password@tcp(127.0.0.1:3307)/formsdb_test?parseTime=true
      FORMS_DB_POSTGRES_ADMIN_DSN: postgres://formsdb:formsdb-test-password@127.0.0.1:5432/formsdb_test?sslmode=disable
      FORMS_DB_MYSQL_ADMIN_DSN: root:formsdb-root-test-password@tcp(127.0.0.1:3306)/formsdb_test?parseTime=true&tls=skip-verify
      FORMS_DB_MARIADB_ADMIN_DSN: root:mariadb-root-test-password@tcp(127.0.0.1:3307)/formsdb_test?parseTime=true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: formsdb_test
          POSTGRES_USER: formsdb
          POSTGRES_PASSWORD: formsdb-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formsdb -d formsdb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: formsdb_test
          MYSQL_USER: formsdb
          MYSQL_PASSWORD: formsdb-test-password
          MYSQL_ROOT_PASSWORD: formsdb-root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=formsdb --password=formsdb-test-password --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: formsdb_test
          MARIADB_USER: formsdb
          MARIADB_PASSWORD: formsdb-test-password
          MARIADB_ROOT_PASSWORD: mariadb-root-test-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      # forms-db consumes pluginprotocol and the Plugin SDK through sibling
      # replace directives (../../pluginprotocol, ../../plugin-sdk), so the
      # checkouts must mirror the workspace layout the module declares.
      - uses: actions/checkout@v4
        with:
          path: plugins/forms-db
      - name: Checkout pluginprotocol
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/pluginprotocol
          path: pluginprotocol
      - name: Checkout plugin-sdk
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/plugin-sdk
          path: plugin-sdk
      # The child-process scenario starts the real Server plugin as its child and
      # resolves it as the sibling ../server, so the Server checkout is part of
      # this gate rather than an optional extra.
      - name: Checkout server
        uses: actions/checkout@v4
        with:
          repository: Liapoldus/server
          path: plugins/server
      - uses: actions/setup-go@v6
        with:
          go-version-file: plugins/forms-db/go.mod
      # Node >= 22.6 is required: the cursor-secret-grants contract runs a .ts
      # file directly through `node --test`, which needs native type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/forms-db/package-lock.json
      - name: Go build
        run: go build ./...
        working-directory: plugins/forms-db
      - name: Go vet
        run: go vet ./...
        working-directory: plugins/forms-db
      - name: Go tests
        run: go test ./...
        working-directory: plugins/forms-db
      # The suite drives real mTLS config pulls, peer dispatch and a SQLite
      # child process, so it is the behavioural gate and not a mock-level check.
      - name: TypeScript contract suite
        run: npm ci && npm test
        working-directory: plugins/forms-db
